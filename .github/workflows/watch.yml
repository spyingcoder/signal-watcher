name: signal watcher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: check for signals
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY }}
        run: python watcher.py

      - name: save state
        run: |
          if [[ -n "$(git status --porcelain watcher_state.json signals.log)" ]]; then
            git config user.name  "signal-watcher"
            git config user.email "watcher@users.noreply.github.com"
            git add watcher_state.json signals.log
            git commit -m "signal state $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
